<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrousel scientifique — pharma, peptides, nouveaux médicaments, biosimilaires</title>
  <meta name="description" content="Articles générés automatiquement à partir des dernières publications PubMed / NCBI.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2322d3ee'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%230b1020'/%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div>
        <h1 data-i18n="title">Carrousel scientifique</h1>
        <p class="brand-sub" data-i18n="subtitle">Pharma · peptides · nouveaux médicaments · biosimilaires — à partir de PubMed / NCBI</p>
      </div>
    </div>
    <div class="topbar-right">
      <div class="lang-switch" id="lang-switch" role="group" aria-label="Langue"></div>
      <div class="status">
        <span id="status-count" aria-live="polite">—</span>
        <span class="sep" aria-hidden="true">·</span>
        <span id="status-next">—</span>
      </div>
    </div>
  </header>

  <nav class="filters" id="filters" aria-label="Filtrer par sujet"></nav>

  <main>
    <section class="carousel" id="carousel" aria-roledescription="carrousel" aria-label="Articles scientifiques">
      <button class="nav prev" id="prev" type="button" aria-label="Article précédent">&#x2039;</button>
      <div class="viewport" id="viewport">
        <ul class="track" id="track"></ul>
      </div>
      <button class="nav next" id="next" type="button" aria-label="Article suivant">&#x203A;</button>
      <div class="controls">
        <button class="play" id="play" type="button" aria-pressed="true" aria-label="Défilement automatique">❚❚</button>
        <ol class="dots" id="dots" aria-label="Choisir un article"></ol>
        <span class="counter" id="counter"></span>
      </div>
      <div class="progress" id="progress" aria-hidden="true"><span></span></div>
    </section>
    <p class="empty" id="empty" hidden></p>
  </main>

  <dialog id="reader" aria-labelledby="reader-title">
    <article class="reader-body">
      <button class="close" id="reader-close" type="button" aria-label="Fermer">×</button>
      <div id="reader-content"></div>
    </article>
  </dialog>

  <button class="toast" id="toast" type="button" hidden></button>

  <footer class="foot">
    <p data-i18n="footer">Contenus générés automatiquement à partir des résumés PubMed ; ils ne constituent pas un avis médical. Sources citées sur chaque fiche.</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
